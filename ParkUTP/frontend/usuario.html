<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkUTP - Usuario</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <div class="header-logo">
            <svg viewBox="0 0 24 24"><path d="M13 3H6v18h4v-6h3c3.31 0 6-2.69 6-6s-2.69-6-6-6zm.2 8H10V7h3.2c1.1 0 2 .9 2 2s-.9 2-2 2z"/></svg>
            <h1>ParkUTP - Usuario</h1>
        </div>
        <div class="user-info">
            <div class="user-badge">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span id="welcome"></span>
            </div>
            <button onclick="logout()">Salir</button>
        </div>
    </header>

    <main>
        <section>
            <div class="section-header">
                <h2>
                    <svg viewBox="0 0 24 24"><path d="M13 3H6v18h4v-6h3c3.31 0 6-2.69 6-6s-2.69-6-6-6zm.2 8H10V7h3.2c1.1 0 2 .9 2 2s-.9 2-2 2z"/></svg>
                    Parkings Disponibles
                </h2>
            </div>
            <div id="listaParkings" class="grid">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </section>

        <section>
            <h2>
                <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                Mis Reservas
            </h2>
            <div class="tabla-container">
                <table id="tablaReservas">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Parking</th>
                            <th>Placa</th>
                            <th>Tipo</th>
                            <th>Tiempo</th>
                            <th>Espacio</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Boleta</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section>
            <h2>
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4-3h2v13h-2z"/></svg>
                Mis Boletas
            </h2>
            <div class="tabla-container">
                <table id="tablaTickets">
                    <thead>
                        <tr>
                            <th>Boleta</th>
                            <th>Fecha</th>
                            <th>Parking</th>
                            <th>Placa</th>
                            <th>Estancia</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modalParking">Reservar</h3>

            <label>Placa</label>
            <input type="text" id="placa" placeholder="Ej: ABC-123">

            <label>Tipo de vehiculo</label>
            <select id="tipoVehiculo">
                <option value="CARRO">Carro</option>
                <option value="MOTO">Moto</option>
                <option value="CAMIONETA">Camioneta</option>
            </select>

            <label>Horas</label>
            <input type="number" id="horas" min="0" value="1">

            <label>Minutos</label>
            <input type="number" id="minutos" min="0" max="59" value="0">

            <div class="precio-box">
                <span>Precio estimado</span>
                <strong>S/. <span id="precioPreview">0.00</span></strong>
            </div>

            <div class="modal-buttons">
                <button onclick="cerrarModal()">Cancelar</button>
                <button onclick="confirmarReserva()" class="primary">Confirmar Reserva</button>
            </div>
        </div>
    </div>

    <!-- Modal confirmar emision de boleta -->
    <div id="modalConfirmarBoleta" class="modal hidden">
        <div class="modal-content modal-large">
            <h3>Emitir boleta de pago</h3>
            <p class="modal-subtitle" id="confirmarBoletaInfo"></p>

            <table class="ticket-detalle">
                <tbody id="confirmarBoletaDetalle"></tbody>
            </table>

            <div class="modal-buttons">
                <button onclick="cerrarModalConfirmarBoleta()">Cancelar</button>
                <button onclick="confirmarEmisionBoleta()" class="primary">Emitir boleta</button>
            </div>
        </div>
    </div>

    <!-- Modal boleta emitida -->
    <div id="modalBoleta" class="modal hidden">
        <div class="modal-content modal-large">
            <h3>Boleta emitida</h3>

            <div id="boletaTicket"></div>

            <div class="modal-buttons">
                <button onclick="cerrarModalBoleta()">Cerrar</button>
                <button onclick="descargarBoletaActual()">Descargar .txt</button>
                <button onclick="imprimirBoletaActual()" class="primary">Imprimir</button>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/boleta.js"></script>
    <script src="/js/usuario.js"></script>
</body>
</html>
