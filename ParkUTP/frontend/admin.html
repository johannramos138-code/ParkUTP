<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkUTP - Admin</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <div class="header-logo">
            <svg viewBox="0 0 24 24"><path d="M13 3H6v18h4v-6h3c3.31 0 6-2.69 6-6s-2.69-6-6-6zm.2 8H10V7h3.2c1.1 0 2 .9 2 2s-.9 2-2 2z"/></svg>
            <h1>ParkUTP - Admin</h1>
        </div>
        <div class="user-info">
            <div class="user-badge">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span id="welcome"></span>
            </div>
            <button onclick="logout()">Salir</button>
        </div>
    </header>

    <main>
        <!-- Stats -->
        <div class="stats-grid" id="statsGrid"></div>

        <section>
            <div class="section-header">
                <h2>
                    <svg viewBox="0 0 24 24"><path d="M13 3H6v18h4v-6h3c3.31 0 6-2.69 6-6s-2.69-6-6-6zm.2 8H10V7h3.2c1.1 0 2 .9 2 2s-.9 2-2 2z"/></svg>
                    Gestion de Parkings
                </h2>
                <button class="btn-primary" onclick="abrirModalNuevo()">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    Nuevo Parking
                </button>
            </div>
            <div id="listaParkings" class="grid">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </section>

        <section>
            <h2>Validar Salida (Escaner QR)</h2>
            <div class="validador-ticket">
                <input type="text" id="ticketInput" placeholder="Escanea o ingresa el ID del ticket">
                <button class="btn-primary" onclick="validarQR()">Validar Ticket</button>
            </div>
            <div id="resultadoValidacion" class="resultado-validacion" aria-live="polite"></div>
        </section>

        <section>
            <h2>
                <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                Todas las Reservas
            </h2>
            <div class="tabla-container">
                <table id="tablaReservas">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Parking</th>
                            <th>Usuario</th>
                            <th>Placa</th>
                            <th>Tipo</th>
                            <th>Tiempo</th>
                            <th>Espacio</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Acciones</th> <!-- NUEVA COLUMNA -->
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal crear/editar parking -->
    <div id="modalParking" class="modal hidden">
        <div class="modal-content modal-large">
            <h3 id="modalTitulo">Nuevo Parking</h3>

            <label>Nombre</label>
            <input type="text" id="pNombre" placeholder="Ej: Parking Centro">

            <label>Direccion</label>
            <input type="text" id="pDireccion" placeholder="Ej: Av. Arequipa 123">

            <label>Numero de espacios (sitios)</label>
            <input type="number" id="pEspacios" min="1" value="20">

            <label>Tarifa por hora - Carro (S/.)</label>
            <input type="number" id="pTarifaHora" step="0.01" min="0" value="5.00">

            <label>Tarifa por hora - Moto (S/.)</label>
            <input type="number" id="pTarifaMoto" step="0.01" min="0" value="2.50">

            <label>Tarifa por hora - Camioneta (S/.)</label>
            <input type="number" id="pTarifaCamioneta" step="0.01" min="0" value="6.00">

            <div class="modal-buttons">
                <button onclick="cerrarModalParking()">Cancelar</button>
                <button onclick="guardarParking()" class="primary">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal Boleta y Pago (Checkout) -->
    <div id="modalPago" class="modal hidden">
        <div class="modal-content" style="max-width: 380px; background: #fff; border-radius: 10px; padding: 0;">
            <!-- Cabecera tipo ticket -->
            <div style="background: #1e293b; color: white; padding: 20px; text-align: center; border-radius: 10px 10px 0 0;">
                <h2 style="margin: 0; font-size: 1.2rem;">ParkUTP</h2>
                <p style="margin: 5px 0 0; font-size: 0.8rem; color: #cbd5e1;">Comprobante de Pago</p>
            </div>
            
            <div style="padding: 20px; font-family: monospace; font-size: 0.9rem; line-height: 1.6; border-bottom: 2px dashed #e2e8f0;">
                <p><strong>Ticket:</strong> <span id="bTicket"></span></p>
                <p><strong>Placa:</strong> <span id="bPlaca"></span></p>
                <p><strong>Tipo:</strong> <span id="bTipo"></span></p>
                <p><strong>Tiempo:</strong> <span id="bTiempo"></span></p>
                <p><strong>Espacio:</strong> <span id="bEspacio"></span></p>
                <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 10px 0;">
                <p style="font-size: 1.2rem; font-weight: bold; color: #10b981;">
                    TOTAL: S/ <span id="bTotal"></span>
                </p>
            </div>

            <div style="padding: 20px;">
                <label style="display: block; margin-bottom: 10px; font-weight: bold;">Método de Pago:</label>
                <select id="selectMetodoPago" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 15px;">
                    <option value="YAPE">Yape</option>
                    <option value="PLIN">Plin</option>
                    <option value="TARJETA">Tarjeta de Crédito/Débito</option>
                    <option value="EFECTIVO">Efectivo</option>
                </select>

                <div class="modal-buttons">
                    <button onclick="cerrarModalPago()" style="background: #ccc; color: #333;">Cancelar</button>
                    <button onclick="procesarPago()" class="primary" style="background: #10b981;">Cobrar y Dar Salida</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
