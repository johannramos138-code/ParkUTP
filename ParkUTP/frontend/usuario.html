<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkUTP - Usuario</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <div class="header-logo">
            <svg viewBox="0 0 24 24"><path d="M13 3H6v18h4v-6h3c3.31 0 6-2.69 6-6s-2.69-6-6-6zm.2 8H10V7h3.2c1.1 0 2 .9 2 2s-.9 2-2 2z"/></svg>
            <h1>ParkUTP</h1>
        </div>
        <div class="user-info">
            <div class="user-badge">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span id="welcome"></span>
            </div>
            <button onclick="logout()">Salir</button>
        </div>
    </header>

    <main>
        <section>
            <h2>
                <svg viewBox="0 0 24 24"><path d="M13 3H6v18h4v-6h3c3.31 0 6-2.69 6-6s-2.69-6-6-6zm.2 8H10V7h3.2c1.1 0 2 .9 2 2s-.9 2-2 2z"/></svg>
                Parkings Disponibles
            </h2>
            <div id="listaParkings" class="grid">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </section>

        <section>
            <h2>
                <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                Mis Reservas
            </h2>
            <div class="tabla-container">
                <table id="tablaReservas">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Parking</th>
                            <th>Placa</th>
                            <th>Tipo</th>
                            <th>Tiempo</th>
                            <th>Espacio</th>
                            <th>Total</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal reserva -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h3>Reservar en <span id="modalParking"></span></h3>

            <label>Tipo de vehiculo</label>
            <select id="tipoVehiculo" onchange="actualizarPrecio()">
                <option value="CARRO">Carro</option>
                <option value="MOTO">Moto</option>
                <option value="CAMIONETA">Camioneta</option>
            </select>

            <label for="placaSelect">Placa</label>
            <select id="placaSelect" onchange="manejarCambioPlaca()">
                <option value="">Selecciona una placa</option>
                <option value="NUEVA">+ Registrar nueva placa</option>
            </select>

            <div id="placaNuevaContainer" class="placa-nueva hidden">
                <label for="placa">Nueva placa</label>
                <input type="text" id="placa" placeholder="Ej: ABC-123" maxlength="20">
            </div>

            <label>Tiempo de ocupacion</label>
            <div class="tiempo-group">
                <input type="number" id="horas" placeholder="Horas" min="0" max="24" value="1" onchange="actualizarPrecio()">
                <input type="number" id="minutos" placeholder="Minutos" min="0" max="59" value="0" onchange="actualizarPrecio()">
            </div>

            <div class="precio-preview">
                Total estimado: S/. <strong><span id="precioPreview">0.00</span></strong>
            </div>

            <div class="modal-buttons">
                <button onclick="cerrarModal()">Cancelar</button>
                <button onclick="confirmarReserva()" class="primary">Reservar</button>
            </div>
        </div>
    </div>

    <!-- Modal de boleta emitida -->
    <div id="modalBoleta" class="modal hidden">
        <div class="modal-content" style="text-align: center; max-width: 380px;">
            <h3>Reserva creada</h3>
            <p><strong>Ticket:</strong> <span id="boletaTicket"></span></p>
            <div id="contenedorQR"></div>
            <p style="font-size: 0.85rem; color: #64748b; margin-top: 12px;">
                Presenta este código QR al salir del estacionamiento.
            </p>
            <div class="modal-buttons">
                <button onclick="cerrarBoletaEmitida()" class="primary" style="width: 100%;">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/usuario.js"></script>
</body>
</html>
