<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkUTP - Login</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-body">
    <div class="login-box">
        <div class="login-logo">
            <svg viewBox="0 0 24 24">
                <path d="M13 3H6v18h4v-6h3c3.31 0 6-2.69 6-6s-2.69-6-6-6zm.2 8H10V7h3.2c1.1 0 2 .9 2 2s-.9 2-2 2z"/>
            </svg>
        </div>
        <h1>ParkUTP</h1>
        <p class="subtitle">Sistema de Gestion de Estacionamientos</p>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Usuario" required autocomplete="username">
            <input type="password" id="password" placeholder="Contrasena" required autocomplete="current-password">
            <button type="submit">Ingresar</button>
        </form>
        <p id="errorMsg" class="error"></p>
        <div class="hint">
            <small>Demo: admin/admin123 · juan/1234</small>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
