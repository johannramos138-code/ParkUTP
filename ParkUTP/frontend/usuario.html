<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ParkUTP - Usuario</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <h1>ParkUTP</h1>
        <div class="user-info">
            <span id="welcome"></span>
            <button onclick="logout()">Salir</button>
        </div>
    </header>

    <main>
        <section>
            <h2>Parkings Disponibles</h2>
            <div id="listaParkings" class="grid"></div>
        </section>

        <section>
            <h2>Mis Reservas</h2>
            <table id="tablaReservas">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Parking</th>
                        <th>Placa</th>
                        <th>Tipo</th>
                        <th>Tiempo</th>
                        <th>Espacio</th>
                        <th>Total</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </main>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h3>Reservar en <span id="modalParking"></span></h3>

            <label>Tipo de vehiculo</label>
            <select id="tipoVehiculo" onchange="actualizarPrecio()">
                <option value="CARRO">Carro</option>
                <option value="MOTO">Moto</option>
                <option value="CAMIONETA">Camioneta</option>
            </select>

            <label>Placa</label>
            <input type="text" id="placa" placeholder="Ej: ABC-123">

            <label>Tiempo de ocupacion (horas) </label>
            <div class="tiempo-group"> 
                <input type="number" id="horas" placeholder="Horas" min="0" max="24" value="1" onchange="actualizarPrecio()">
                <input type="number" id="minutos" placeholder="Minutos" min="0" max="59" value="0" onchange="actualizarPrecio()">
            </div>

            <div class="precio-preview">
                <strong>Total estimado: S/. <span id="precioPreview">0.00</span></strong>
            </div>

            <div class="modal-buttons">
                <button onclick="cerrarModal()">Cancelar</button>
                <button onclick="confirmarReserva()" class="primary">Reservar</button>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/usuario.js"></script>
</body>
</html>
